<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meu primeiro programa</title>
    <Style>
        body {
            background-color: rgb(92, 193, 226);
            color: white;
            font:normal 20pt Arial;
        }
    </Style>
</head>
<body>
    <h1>Olá, mundo!</h1>

    <p>Já me livrei da maldição!</p>

    <script>
        var nome = window.prompt("qual é o seu nome?");
        var idade = window.prompt("qual é a sua idade?");
        var peso = window.prompt("qual é o seu peso?");
        var ano = window.prompt("qual é o ano atual?");
        var nasc = ano - idade;
        window.alert("Olá, é um prazer te conheçer " + nome + ", você tem " + idade + " anos e pesa " + peso + " kg" + ". Você nasceu em " + nasc + ".");
        
    </script>
</body>
</html>
